<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>18-1 高梓括 · Canvas 粒子文字动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    overflow: hidden;
    color: #e7eefb;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    background:
      radial-gradient(1100px 620px at 50% 38%, #17224a 0%, rgba(9, 12, 24, 0) 62%),
      radial-gradient(760px 460px at 12% 88%, rgba(34, 211, 238, 0.16), transparent 66%),
      radial-gradient(760px 460px at 88% 10%, rgba(168, 85, 247, 0.18), transparent 66%),
      #06080f;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.55;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 5%, transparent 72%);
    mask-image: radial-gradient(circle at 50% 45%, #000 5%, transparent 72%);
  }

  .ui {
    position: fixed;
    inset: 0;
    padding: 26px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
  }

  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 16px;
    font-size: 12px;
    letter-spacing: 0.6px;
    color: #b9c8e4;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
  }

  .chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 10px #22d3ee;
  }

  .chip strong {
    color: #f2f7ff;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .title {
    margin-top: 14px;
    font-size: 15px;
    letter-spacing: 5px;
    color: rgba(190, 208, 236, 0.5);
    text-transform: uppercase;
  }

  .btn {
    pointer-events: auto;
    cursor: pointer;
    padding: 10px 20px;
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #dbe7ff;
    border: 1px solid rgba(140, 175, 255, 0.4);
    border-radius: 999px;
    background: rgba(90, 130, 240, 0.14);
    backdrop-filter: blur(10px);
    transition: all 0.25s ease;
  }

  .btn:hover {
    color: #fff;
    border-color: rgba(180, 205, 255, 0.85);
    background: rgba(110, 150, 255, 0.28);
    box-shadow: 0 8px 24px rgba(90, 130, 240, 0.3);
  }

  .btn:active { transform: translateY(1px); }

  .foot {
    font-size: 12px;
    letter-spacing: 1.2px;
    color: rgba(168, 186, 216, 0.55);
    line-height: 1.9;
  }

  .foot b { color: rgba(226, 236, 255, 0.85); font-weight: 600; }

  @media (max-width: 720px) {
    .ui { padding: 18px; }
    .chip { font-size: 11px; padding: 7px 12px; }
    .title { font-size: 12px; letter-spacing: 3px; }
    .foot { font-size: 11px; }
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="grid"></div>

  <div class="ui">
    <div class="row">
      <div>
        <div class="chip">
          <span class="dot"></span>
          <span>高级网页设计 · <strong>18-1</strong> · Canvas 2D</span>
        </div>
        <div class="title">Particle Typography</div>
      </div>
      <button class="btn" id="replay">重新凝聚</button>
    </div>

    <div class="row">
      <div class="foot">
        <b>高梓括</b> · 计算机 24010 · 24001011019<br />
        Canvas 像素采样 + 弹性粒子系统
      </div>
      <div class="foot" style="text-align: right;">
        移动鼠标扰动粒子<br />
        点击画面产生爆散
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var TEXT = "高梓括";
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var W = 1, H = 1, dpr = 1;
  var particles = [];
  var dust = [];
  var glowCanvas = null;
  var clock = 0;
  var last = performance.now();
  var pointer = { x: -1e4, y: -1e4 };

  var BUCKETS = 14;
  var buckets = [];
  for (var i = 0; i < BUCKETS; i++) buckets.push([]);

  function rand(min, max) { return min + Math.random() * (max - min); }

  /* ---------------- 文字采样 ---------------- */
  function sampleText() {
    var off = document.createElement("canvas");
    off.width = Math.max(1, Math.round(W));
    off.height = Math.max(1, Math.round(H));
    var octx = off.getContext("2d");
    var fontSize = Math.min(W / 4.05, H / 2.85);
    var fontStr = "900 " + fontSize.toFixed(1) + 'px "Microsoft YaHei","PingFang SC","Heiti SC",sans-serif';

    octx.font = fontStr;
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillStyle = "#fff";
    octx.fillText(TEXT, off.width / 2, off.height / 2 - off.height * 0.02);

    var data = octx.getImageData(0, 0, off.width, off.height).data;
    var step = Math.max(3, Math.round(fontSize / 54));
    var pts = [];

    for (var y = 0; y < off.height; y += step) {
      for (var x = 0; x < off.width; x += step) {
        var alpha = data[(y * off.width + x) * 4 + 3];
        if (alpha > 145) pts.push([x, y]);
      }
    }

    return { pts: pts, fontSize: fontSize, fontStr: fontStr };
  }

  /* ---------------- 光晕层 ---------------- */
  function buildGlow(fontStr) {
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(W * dpr));
    c.height = Math.max(1, Math.round(H * dpr));
    var g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.font = fontStr;
    g.textAlign = "center";
    g.textBaseline = "middle";

    var grad = g.createLinearGradient(W * 0.26, 0, W * 0.74, 0);
    grad.addColorStop(0, "#22d3ee");
    grad.addColorStop(0.5, "#8b8cf8");
    grad.addColorStop(1, "#f472b6");

    g.shadowColor = "rgba(120,140,255,0.85)";
    g.shadowBlur = 70;
    g.globalAlpha = 0.95;
    g.fillStyle = grad;
    g.fillText(TEXT, W / 2, H / 2 - H * 0.02);
    g.shadowBlur = 30;
    g.fillText(TEXT, W / 2, H / 2 - H * 0.02);

    return c;
  }

  /* ---------------- 构建粒子 ---------------- */
  function build() {
    var res = sampleText();
    var pts = res.pts;
    var maxCount = 5200;
    var stride = Math.max(1, Math.ceil(pts.length / maxCount));

    particles = [];
    for (var i = 0; i < pts.length; i += stride) {
      var px = pts[i][0];
      var py = pts[i][1];
      var ang = Math.random() * Math.PI * 2;
      var radius = Math.max(W, H) * rand(0.32, 0.95);
      var hue = 176 + (px / W) * 148;

      particles.push({
        x: W / 2 + Math.cos(ang) * radius,
        y: H / 2 + Math.sin(ang) * radius,
        tx: px,
        ty: py,
        vx: 0,
        vy: 0,
        size: rand(1.15, 2.65),
        hue: hue,
        bucket: Math.min(BUCKETS - 1, Math.max(0, Math.floor(((hue - 176) / 148) * BUCKETS))),
        phase: Math.random() * Math.PI * 2,
        delay: reduceMotion ? 0 : Math.random() * 46
      });
    }

    glowCanvas = buildGlow(res.fontStr);

    dust = [];
    var dustCount = Math.round(Math.min(90, (W * H) / 26000));
    for (var d = 0; d < dustCount; d++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rand(0.5, 1.7),
        vx: rand(-0.12, 0.12),
        vy: rand(-0.34, -0.05),
        a: rand(0.15, 0.55)
      });
    }
  }

  /* ---------------- 尺寸 ---------------- */
  function resize() {
    var rect = canvas.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    build();
  }

  /* ---------------- 更新 ---------------- */
  function updateParticle(p, t) {
    if (p.delay > 0) { p.delay -= 1; return; }

    var wobX = Math.sin(t * 0.9 + p.phase) * 2.1;
    var wobY = Math.cos(t * 1.15 + p.phase * 1.4) * 1.9;

    var ax = (p.tx + wobX - p.x) * 0.055;
    var ay = (p.ty + wobY - p.y) * 0.055;

    var dx = p.x - pointer.x;
    var dy = p.y - pointer.y;
    var d2 = dx * dx + dy * dy;
    var R = 110;
    if (d2 < R * R && d2 > 0.5) {
      var dist = Math.sqrt(d2);
      var force = (1 - dist / R) * 8;
      ax += (dx / dist) * force;
      ay += (dy / dist) * force;
    }

    p.vx = (p.vx + ax) * 0.83;
    p.vy = (p.vy + ay) * 0.83;
    p.x += p.vx;
    p.y += p.vy;
  }

  /* ---------------- 渲染 ---------------- */
  function frame(now) {
    var dt = Math.min(64, now - last) / 1000;
    last = now;
    if (!reduceMotion) clock += dt;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // 光晕
    if (glowCanvas) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.17 + Math.sin(clock * 1.3) * 0.05;
      ctx.drawImage(glowCanvas, 0, 0, W, H);
      ctx.restore();
    }

    // 星尘
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      d.x += d.vx;
      d.y += d.vy;
      if (d.y < -8) { d.y = H + 8; d.x = Math.random() * W; }
      if (d.x < -8) d.x = W + 8;
      if (d.x > W + 8) d.x = -8;
      ctx.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(clock * 2 + d.x));
      ctx.fillStyle = "#9fc4ff";
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 粒子
    for (var b = 0; b < BUCKETS; b++) buckets[b].length = 0;
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      updateParticle(p, clock);
      buckets[p.bucket].push(p);
    }

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var bi = 0; bi < BUCKETS; bi++) {
      var arr = buckets[bi];
      if (!arr.length) continue;
      var hue = 176 + ((bi + 0.5) / BUCKETS) * 148;
      ctx.fillStyle = "hsl(" + hue.toFixed(1) + ", 100%, 66%)";
      ctx.globalAlpha = 0.92;
      for (var j = 0; j < arr.length; j++) {
        var pt = arr[j];
        ctx.fillRect(pt.x - pt.size * 0.5, pt.y - pt.size * 0.5, pt.size, pt.size);
      }
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }

  /* ---------------- 交互 ---------------- */
  canvas.addEventListener("pointermove", function (e) {
    var rect = canvas.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
  });

  canvas.addEventListener("pointerleave", function () {
    pointer.x = -1e4;
    pointer.y = -1e4;
  });

  canvas.addEventListener("pointerdown", function (e) {
    var rect = canvas.getBoundingClientRect();
    var cx = e.clientX - rect.left;
    var cy = e.clientY - rect.top;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var dx = p.x - cx;
      var dy = p.y - cy;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      if (dist < 280) {
        var power = (1 - dist / 280) * 26;
        p.vx += (dx / dist) * power + rand(-3, 3);
        p.vy += (dy / dist) * power + rand(-3, 3);
      }
    }
  });

  document.getElementById("replay").addEventListener("click", function () {
    clock = 0;
    build();
  });

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 160);
  });

  resize();
  requestAnimationFrame(function (t) {
    last = t;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
