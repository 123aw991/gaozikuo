<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>注册 · LLM 应用设计实验</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
<div class="auth-bg"><span></span><span></span><span></span></div>

<main class="auth-card">
  <div class="auth-head">
    <div class="auth-logo">✨</div>
    <h1>创建账号</h1>
    <p>注册后即可体验完整的 LLM 应用实验功能</p>
  </div>

  <form id="registerForm" class="auth-form" novalidate>
    <div class="form-item">
      <label for="username">用户名</label>
      <div class="input-wrap"><span class="ico">👤</span><input id="username" name="username" type="text" placeholder="2-20 位，字母/数字/下划线/中文" autocomplete="username" /></div>
    </div>
    <div class="form-item">
      <label for="email">邮箱</label>
      <div class="input-wrap"><span class="ico">✉</span><input id="email" name="email" type="email" placeholder="example@domain.com" autocomplete="email" /></div>
    </div>
    <div class="form-item">
      <label for="password">密码</label>
      <div class="input-wrap"><span class="ico">🔒</span><input id="password" name="password" type="password" placeholder="6-64 位" autocomplete="new-password" /><button type="button" class="eye" id="togglePwd">显示</button></div>
    </div>
    <div class="form-item">
      <label for="confirm">确认密码</label>
      <div class="input-wrap"><span class="ico">🔑</span><input id="confirm" name="confirm" type="password" placeholder="再次输入密码" autocomplete="new-password" /></div>
    </div>
    <div class="err-msg" id="errMsg"></div>
    <button type="submit" class="btn primary auth-submit" id="submitBtn">注册并登录</button>
  </form>

  <div class="auth-foot">
    <span>已有账号？<a href="login.html">立即登录</a></span>
    <a href="index.html">← 返回门户</a>
  </div>
  <div class="auth-tip">密码使用 scrypt 加盐哈希存储，服务端不保存明文</div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
