<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>18-5 高梓括 · AI 智能聊天助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #070b14;
    --panel: rgba(16, 26, 45, 0.92);
    --panel-2: rgba(12, 20, 36, 0.92);
    --line: rgba(120, 150, 200, 0.18);
    --text: #e6edfa;
    --muted: #8ea3c4;
    --sky: #38bdf8;
    --violet: #b57bff;
  }

  html, body { height: 100%; }

  body {
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    background:
      radial-gradient(1100px 640px at 10% -10%, rgba(56, 189, 248, 0.14), transparent 62%),
      radial-gradient(900px 600px at 94% 4%, rgba(181, 123, 255, 0.14), transparent 62%),
      var(--bg);
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 316px 1fr;
    height: 100vh;
  }

  /* ---------------- 侧栏 ---------------- */
  .sidebar {
    border-right: 1px solid var(--line);
    background: var(--panel-2);
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .brand .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--sky), var(--violet));
    display: grid;
    place-items: center;
    font-size: 19px;
    box-shadow: 0 8px 22px rgba(56, 189, 248, 0.32);
  }

  .brand h1 { font-size: 16px; letter-spacing: 1px; }
  .brand p { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: 0.6px; }

  .group {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    background: rgba(20, 34, 58, 0.45);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .group h2 {
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #9db4d6;
    font-weight: 700;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field label { font-size: 11.5px; color: var(--muted); letter-spacing: 0.5px; }

  .field input, .field textarea, .field select {
    width: 100%;
    padding: 9px 11px;
    font-size: 12.5px;
    color: var(--text);
    background: rgba(8, 15, 28, 0.9);
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .field textarea { resize: vertical; min-height: 66px; line-height: 1.6; }

  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: rgba(56, 189, 248, 0.65);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
  }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; }

  .presets button, .ghost-btn {
    font-size: 11.5px;
    color: #aec6e8;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(30, 52, 88, 0.5);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .presets button:hover, .ghost-btn:hover {
    color: #fff;
    border-color: rgba(56, 189, 248, 0.55);
    background: rgba(56, 189, 248, 0.16);
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }

  .switch input { width: 16px; height: 16px; accent-color: #38bdf8; cursor: pointer; }

  .side-actions { display: flex; gap: 8px; margin-top: auto; }

  .side-actions button {
    flex: 1;
    padding: 9px 10px;
    font-size: 12.5px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: rgba(30, 52, 88, 0.5);
    color: #cfe0f8;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .side-actions button:hover { border-color: rgba(56, 189, 248, 0.55); color: #fff; }

  .side-actions .danger:hover { border-color: rgba(244, 114, 182, 0.6); color: #ffc7e5; background: rgba(244, 114, 182, 0.12); }

  .console-tip {
    font-size: 11px;
    line-height: 1.75;
    color: #7d94b8;
    border-left: 2px solid rgba(56, 189, 248, 0.5);
    padding-left: 9px;
  }

  .console-tip b { color: #9fd8ff; font-weight: 600; }

  /* ---------------- 聊天区 ---------------- */
  .chat { display: flex; flex-direction: column; min-width: 0; height: 100vh; }

  .chat-head {
    height: 62px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 26px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 18, 32, 0.7);
    backdrop-filter: blur(8px);
  }

  .chat-head .title { font-size: 14.5px; letter-spacing: 1px; }

  .badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    color: #9fd8ff;
    border: 1px solid rgba(56, 189, 248, 0.35);
    background: rgba(56, 189, 248, 0.1);
    font-family: Consolas, monospace;
  }

  .chat-head .spacer { flex: 1; }

  .chat-head .meta { font-size: 11.5px; color: var(--muted); font-family: Consolas, monospace; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 26px 26px 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb {
    background: rgba(120, 150, 200, 0.25);
    border-radius: 4px;
  }

  .msg { display: flex; gap: 12px; max-width: 900px; width: 100%; }

  .msg .avatar {
    width: 34px; height: 34px;
    flex-shrink: 0;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 15px;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.3);
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg.user .avatar {
    background: rgba(181, 123, 255, 0.16);
    border-color: rgba(181, 123, 255, 0.34);
  }

  .bubble-wrap { min-width: 0; max-width: calc(100% - 50px); display: flex; flex-direction: column; gap: 6px; }

  .msg.user .bubble-wrap { align-items: flex-end; }

  .bubble {
    padding: 13px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.85;
    background: rgba(20, 34, 58, 0.85);
    border: 1px solid var(--line);
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, rgba(56, 120, 220, 0.55), rgba(130, 90, 220, 0.5));
    border-color: rgba(120, 160, 240, 0.35);
  }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h3, .bubble h4 { margin: 12px 0 7px; font-size: 14.5px; color: #cfe6ff; }
  .bubble ul, .bubble ol { margin: 6px 0 8px; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble strong { color: #9fd8ff; font-weight: 700; }
  .bubble em { color: #d7c4ff; font-style: italic; }
  .bubble blockquote {
    border-left: 3px solid rgba(56, 189, 248, 0.5);
    padding: 2px 0 2px 12px;
    color: #a9c2e6;
    margin: 8px 0;
  }

  .bubble code.inline {
    font-family: Consolas, monospace;
    font-size: 12.5px;
    padding: 2px 6px;
    border-radius: 5px;
    background: rgba(56, 189, 248, 0.14);
    color: #9fd8ff;
  }

  .code-block {
    margin: 10px 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: #060c17;
  }

  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px;
    font-size: 11px;
    color: #8ea3c4;
    background: rgba(30, 52, 88, 0.55);
    font-family: Consolas, monospace;
    letter-spacing: 0.5px;
  }

  .code-head button {
    font-size: 11px;
    color: #9fd8ff;
    background: transparent;
    border: 1px solid rgba(56, 189, 248, 0.32);
    border-radius: 6px;
    padding: 3px 9px;
    cursor: pointer;
    font-family: inherit;
  }

  .code-head button:hover { background: rgba(56, 189, 248, 0.16); }

  .code-block pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12.5px;
    line-height: 1.7;
    color: #cfe0f8;
  }

  .reasoning {
    border: 1px dashed rgba(181, 123, 255, 0.35);
    border-radius: 10px;
    background: rgba(181, 123, 255, 0.07);
    font-size: 12.5px;
    color: #b9a8dd;
    padding: 0 12px;
  }

  .reasoning summary {
    cursor: pointer;
    padding: 8px 0;
    color: #c8b6ee;
    font-size: 12px;
    letter-spacing: 0.5px;
    outline: none;
  }

  .reasoning .body { padding: 0 0 10px; line-height: 1.8; white-space: pre-wrap; }

  .msg-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: #7189ad;
    font-family: Consolas, monospace;
  }

  .msg-foot button {
    background: transparent;
    border: none;
    color: #7189ad;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }

  .msg-foot button:hover { color: #9fd8ff; }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #38bdf8;
    animation: blink 1.1s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.18s; }
  .typing i:nth-child(3) { animation-delay: 0.36s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-3px); }
  }

  .error-bubble {
    border-color: rgba(244, 114, 182, 0.45) !important;
    background: rgba(244, 114, 182, 0.1) !important;
    color: #ffc7e5;
  }

  /* ---------------- 输入区 ---------------- */
  .composer {
    flex-shrink: 0;
    margin: 8px 26px 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(16, 26, 45, 0.92);
    padding: 11px 12px 10px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    transition: border-color 0.2s ease;
  }

  .composer:focus-within { border-color: rgba(56, 189, 248, 0.55); }

  .composer textarea {
    width: 100%;
    min-height: 46px;
    max-height: 180px;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    line-height: 1.75;
    font-family: inherit;
    padding: 4px 4px 0;
  }

  .composer textarea::placeholder { color: #62789b; }

  .composer-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
  }

  .composer-bar .hint { font-size: 11px; color: #62789b; letter-spacing: 0.4px; }
  .composer-bar .grow { flex: 1; }

  .btn-send, .btn-stop {
    padding: 9px 22px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 13.5px;
    font-family: inherit;
    letter-spacing: 1px;
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .btn-send {
    color: #04101f;
    background: linear-gradient(135deg, #7ee0d0, #38bdf8);
    box-shadow: 0 8px 22px rgba(56, 189, 248, 0.32);
    font-weight: 700;
  }

  .btn-send:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(56, 189, 248, 0.42); }
  .btn-send:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-stop {
    color: #ffc7e5;
    background: rgba(244, 114, 182, 0.16);
    border: 1px solid rgba(244, 114, 182, 0.45);
  }

  .quick {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 10px;
  }

  .quick button {
    font-size: 12px;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(30, 52, 88, 0.4);
    color: #a9c2e6;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .quick button:hover { border-color: rgba(56, 189, 248, 0.5); color: #fff; background: rgba(56, 189, 248, 0.14); }

  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .messages { padding: 18px 14px 8px; }
    .composer { margin: 6px 14px 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- ================= 侧栏 ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">✦</div>
      <div>
        <h1>AI 聊天助手</h1>
        <p>OpenAI 兼容接口 · DeepSeek / conatus</p>
      </div>
    </div>

    <div class="group">
      <h2>接口配置</h2>

      <div class="field">
        <label for="baseURL">BaseURL</label>
        <input id="baseURL" type="text" spellcheck="false" />
      </div>

      <div class="field">
        <label for="model">Model ID</label>
        <input id="model" type="text" spellcheck="false" />
      </div>

      <div class="field">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" spellcheck="false" />
      </div>

      <div class="field">
        <label for="systemPrompt">系统提示词</label>
        <textarea id="systemPrompt" spellcheck="false"></textarea>
      </div>

      <div class="switch-row">
        <label class="switch"><input type="checkbox" id="streamToggle" checked /> 流式输出</label>
        <label class="switch"><input type="checkbox" id="logChunk" /> 逐块打印</label>
      </div>

      <div class="presets">
        <button type="button" data-preset="qnaigc">七牛云 conatus</button>
        <button type="button" data-preset="siliconflow">硅基流动 DeepSeek</button>
      </div>
    </div>

    <div class="console-tip">
      打开开发者工具 <b>F12 → Console</b>，可查看每次对话<b>发送给大模型</b>的完整请求数据（URL、Headers、Body、messages）以及<b>从大模型接收</b>的原始响应（JSON / SSE 分块、Token 用量）。
    </div>

    <div class="side-actions">
      <button type="button" id="saveBtn">保存配置</button>
      <button type="button" id="clearBtn" class="danger">清空对话</button>
    </div>
  </aside>

  <!-- ================= 聊天区 ================= -->
  <main class="chat">
    <header class="chat-head">
      <span class="title">对话窗口</span>
      <span class="badge" id="modelBadge">model</span>
      <span class="spacer"></span>
      <span class="meta" id="usageMeta">tokens: 0</span>
    </header>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="quick" id="quick">
        <button type="button">用一句话介绍你自己</button>
        <button type="button">用 JS 写一个防抖函数</button>
        <button type="button">解释一下什么是 RAG</button>
      </div>
      <textarea id="input" placeholder="输入你的问题，Enter 发送，Shift + Enter 换行"></textarea>
      <div class="composer-bar">
        <span class="hint" id="statusHint">就绪 · 请求数据会打印到控制台</span>
        <span class="grow"></span>
        <button type="button" class="btn-stop" id="stopBtn" hidden>停止</button>
        <button type="button" class="btn-send" id="sendBtn">发送</button>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* ================= 预设配置 ================= */
  var PRESETS = {
    qnaigc: {
      name: "七牛云 conatus",
      baseURL: "https://api.qnaigc.com/v1",
      model: "qiniu/conatus-free",
      apiKey: "sk-21ae365ee2c9867b53c4b0630929a44a418f42b2dce3df99d17808e509e53884"
    },
    siliconflow: {
      name: "硅基流动 SiliconFlow",
      baseURL: "https://api.siliconflow.cn/v1",
      model: "deepseek-ai/DeepSeek-V4-Flash",
      apiKey: ""
    }
  };

  var DEFAULT_SYSTEM = "你是一个有用的助手，回答简洁准确，必要时给出代码示例。";
  var STORE_KEY = "ai-chat-config-v1";

  /* ================= 元素 ================= */
  var el = {
    baseURL: document.getElementById("baseURL"),
    model: document.getElementById("model"),
    apiKey: document.getElementById("apiKey"),
    systemPrompt: document.getElementById("systemPrompt"),
    stream: document.getElementById("streamToggle"),
    logChunk: document.getElementById("logChunk"),
    saveBtn: document.getElementById("saveBtn"),
    clearBtn: document.getElementById("clearBtn"),
    messages: document.getElementById("messages"),
    input: document.getElementById("input"),
    sendBtn: document.getElementById("sendBtn"),
    stopBtn: document.getElementById("stopBtn"),
    statusHint: document.getElementById("statusHint"),
    modelBadge: document.getElementById("modelBadge"),
    usageMeta: document.getElementById("usageMeta"),
    quick: document.getElementById("quick")
  };

  /* ================= 配置读写 ================= */
  function loadConfig() {
    var cfg = null;
    try { cfg = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { cfg = null; }
    if (!cfg) cfg = { baseURL: PRESETS.qnaigc.baseURL, model: PRESETS.qnaigc.model, apiKey: PRESETS.qnaigc.apiKey, system: DEFAULT_SYSTEM };
    el.baseURL.value = cfg.baseURL;
    el.model.value = cfg.model;
    el.apiKey.value = cfg.apiKey;
    el.systemPrompt.value = cfg.system || DEFAULT_SYSTEM;
    syncBadge();
  }

  function saveConfig() {
    var cfg = {
      baseURL: el.baseURL.value.trim().replace(/\/+$/, ""),
      model: el.model.value.trim(),
      apiKey: el.apiKey.value.trim(),
      system: el.systemPrompt.value
    };
    try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) { /* 忽略 */ }
    syncBadge();
    setStatus("配置已保存到本地 localStorage");
  }

  function readConfig() {
    return {
      baseURL: el.baseURL.value.trim().replace(/\/+$/, ""),
      model: el.model.value.trim(),
      apiKey: el.apiKey.value.trim(),
      system: el.systemPrompt.value
    };
  }

  function syncBadge() {
    el.modelBadge.textContent = el.model.value.trim() || "未设置模型";
  }

  function setStatus(text) { el.statusHint.textContent = text; }

  /* ================= Markdown 轻量渲染 ================= */
  var codeStore = {};
  var codeSeq = 0;

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inlineFormat(s) {
    s = s.replace(/`([^`\n]+)`/g, function (_, c) { return "<code class='inline'>" + c + "</code>"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    return s;
  }

  function renderBlocks(text) {
    var lines = text.split("\n");
    var out = [];
    var listType = null;
    var para = [];

    function closeList() {
      if (listType) { out.push("</" + listType + ">"); listType = null; }
    }
    function flushPara() {
      if (para.length) { out.push("<p>" + para.join("<br/>") + "</p>"); para = []; }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = escapeHtml(lines[i]);
      var trimmed = line.trim();

      if (/^###\s+/.test(trimmed)) { flushPara(); closeList(); out.push("<h4>" + trimmed.replace(/^###\s+/, "") + "</h4>"); continue; }
      if (/^##\s+/.test(trimmed)) { flushPara(); closeList(); out.push("<h3>" + trimmed.replace(/^##\s+/, "") + "</h3>"); continue; }
      if (/^#\s+/.test(trimmed)) { flushPara(); closeList(); out.push("<h3>" + trimmed.replace(/^#\s+/, "") + "</h3>"); continue; }
      if (/^>\s?/.test(trimmed)) { flushPara(); closeList(); out.push("<blockquote>" + inlineFormat(trimmed.replace(/^>\s?/, "")) + "</blockquote>"); continue; }
      if (/^[-*]\s+/.test(trimmed)) {
        flushPara();
        if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; }
        out.push("<li>" + inlineFormat(trimmed.replace(/^[-*]\s+/, "")) + "</li>");
        continue;
      }
      if (/^\d+\.\s+/.test(trimmed)) {
        flushPara();
        if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; }
        out.push("<li>" + inlineFormat(trimmed.replace(/^\d+\.\s+/, "")) + "</li>");
        continue;
      }
      if (trimmed === "") { flushPara(); closeList(); continue; }

      closeList();
      para.push(inlineFormat(trimmed));
    }

    flushPara();
    closeList();
    return out.join("");
  }

  function renderMarkdown(src) {
    var segments = String(src).split("```");
    var html = "";

    for (var i = 0; i < segments.length; i++) {
      if (i % 2 === 1) {
        var seg = segments[i];
        var nl = seg.indexOf("\n");
        var lang = nl > 0 ? seg.slice(0, nl).trim() : "";
        var code = nl > 0 ? seg.slice(nl + 1) : seg;
        if (!lang && nl <= 0) code = seg;

        var id = "code-" + (++codeSeq);
        codeStore[id] = code.replace(/\n$/, "");

        html += "<div class='code-block'>" +
          "<div class='code-head'><span>" + escapeHtml(lang || "text") + "</span>" +
          "<button type='button' class='copy-btn' data-code='" + id + "'>复制</button></div>" +
          "<pre><code>" + escapeHtml(code.replace(/\n$/, "")) + "</code></pre></div>";
      } else {
        html += renderBlocks(segments[i]);
      }
    }
    return html;
  }

  /* ================= 消息渲染 ================= */
  var history = [];

  function scrollToBottom() {
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function createMessage(role, text) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + role;

    var avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "我" : "AI";

    var bubbleWrap = document.createElement("div");
    bubbleWrap.className = "bubble-wrap";

    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "user") bubble.textContent = text;
    else bubble.innerHTML = renderMarkdown(text);

    bubbleWrap.appendChild(bubble);
    wrap.appendChild(avatar);
    wrap.appendChild(bubbleWrap);
    el.messages.appendChild(wrap);
    scrollToBottom();

    return { root: wrap, wrap: bubbleWrap, bubble: bubble };
  }

  function createAssistantMessage() {
    var node = createMessage("assistant", "");

    var reasoning = document.createElement("details");
    reasoning.className = "reasoning";
    reasoning.style.display = "none";
    reasoning.innerHTML = "<summary>思考过程（reasoning）</summary><div class='body'></div>";

    var typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = "<i></i><i></i><i></i>";
    node.bubble.appendChild(typing);

    node.wrap.insertBefore(reasoning, node.bubble);

    var foot = document.createElement("div");
    foot.className = "msg-foot";
    foot.innerHTML = "<span class='tok'></span><button type='button' class='copy-msg'>复制全文</button>";
    node.wrap.appendChild(foot);

    node.reasoning = reasoning;
    node.reasoningBody = reasoning.querySelector(".body");
    node.typing = typing;
    node.foot = foot;
    node.tok = foot.querySelector(".tok");

    return node;
  }

  /* ================= 控制台日志 ================= */
  var CSS_LOG = "background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;padding:2px 8px;border-radius:4px;font-weight:700";
  var CSS_RES = "background:linear-gradient(90deg,#059669,#0ea5e9);color:#fff;padding:2px 8px;border-radius:4px;font-weight:700";
  var CSS_ERR = "background:#be123c;color:#fff;padding:2px 8px;border-radius:4px;font-weight:700";

  function logRequest(url, headers, body) {
    console.log("%c → 发送给大模型的数据 ", CSS_LOG);
    console.log("请求地址 URL：", url);
    console.log("请求头 Headers：", headers);
    console.log("请求体 Body（对象）：", body);
    console.log("请求体 Body（JSON 字符串）：\n" + JSON.stringify(body, null, 2));
  }

  function logResponse(data) {
    console.log("%c ← 从大模型接收到的数据 ", CSS_RES);
    console.log("原始响应 JSON：", data);
    if (data && data.choices && data.choices[0] && data.choices[0].message) {
      console.log("回复内容 content：", data.choices[0].message.content);
      if (data.choices[0].message.reasoning_content) {
        console.log("思考过程 reasoning_content：", data.choices[0].message.reasoning_content);
      }
    }
    if (data && data.usage) console.log("Token 用量 usage：", data.usage);
  }

  function logChunk(index, obj) {
    if (!el.logChunk.checked) return;
    console.log("%c 流式分块 #" + index + " ", "color:#0ea5e9", obj);
  }

  function logError(err) {
    console.group("%c ✕ 请求失败 ", CSS_ERR);
    console.error(err);
    console.groupEnd();
  }

  /* ================= 发送消息 ================= */
  var controller = null;

  function buildMessages(userText) {
    var cfg = readConfig();
    var msgs = [];
    if (cfg.system && cfg.system.trim()) msgs.push({ role: "system", content: cfg.system.trim() });
    for (var i = 0; i < history.length; i++) msgs.push({ role: history[i].role, content: history[i].content });
    msgs.push({ role: "user", content: userText });
    return msgs;
  }

  function setBusy(busy) {
    el.sendBtn.disabled = busy;
    el.stopBtn.hidden = !busy;
    el.input.disabled = false;
  }

  function sendMessage() {
    var text = el.input.value.trim();
    if (!text || controller) return;

    var cfg = readConfig();
    if (!cfg.baseURL || !cfg.model) { setStatus("请先填写 BaseURL 与 Model ID"); return; }
    if (!cfg.apiKey) { setStatus("请先填写 API Key"); return; }

    el.input.value = "";
    autoGrow();

    createMessage("user", text);
    history.push({ role: "user", content: text });

    var node = createAssistantMessage();
    controller = new AbortController();
    setBusy(true);
    setStatus("正在请求模型…（数据已打印到 Console）");

    var url = cfg.baseURL + "/chat/completions";
    var headers = {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + cfg.apiKey
    };
    var body = {
      model: cfg.model,
      messages: buildMessages(text),
      stream: !!el.stream.checked,
      temperature: 0.7,
      max_tokens: 2048
    };

    logRequest(url, headers, body);

    var started = Date.now();
    var answer = "";
    var reasoningText = "";
    var usage = null;

    function finish() {
      node.typing.remove();
      node.bubble.innerHTML = renderMarkdown(answer || "（无内容返回）");
      if (reasoningText) {
        node.reasoning.style.display = "";
        node.reasoningBody.textContent = reasoningText;
      }
      node.tok.textContent = (usage ? "tokens " + usage.total_tokens + " · " : "") + ((Date.now() - started) / 1000).toFixed(1) + "s";
      if (answer) history.push({ role: "assistant", content: answer });
      if (usage && usage.total_tokens) el.usageMeta.textContent = "tokens: " + usage.total_tokens;
      controller = null;
      setBusy(false);
      setStatus("完成 · 用时 " + ((Date.now() - started) / 1000).toFixed(1) + "s");
      scrollToBottom();
    }

    function fail(err) {
      node.typing.remove();
      node.bubble.classList.add("error-bubble");
      node.bubble.textContent = "请求失败：" + (err && err.message ? err.message : err);
      node.foot.remove();
      controller = null;
      setBusy(false);
      setStatus("请求失败，详见 Console");
      logError(err);
      console.log("%c → 失败的请求数据 ", CSS_ERR, { url: url, headers: headers, body: body });
      scrollToBottom();
    }

    fetch(url, {
      method: "POST",
      headers: headers,
      body: JSON.stringify(body),
      signal: controller.signal
    }).then(function (res) {
      console.log("%c HTTP 状态码 ", "color:#f59e0b;font-weight:700", res.status, res.statusText);
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error("HTTP " + res.status + " " + (t || res.statusText));
        });
      }

      if (!body.stream) {
        return res.json().then(function (data) {
          logResponse(data);
          usage = data.usage || null;
          var msg = data.choices && data.choices[0] && data.choices[0].message;
          answer = (msg && msg.content) || "";
          reasoningText = (msg && msg.reasoning_content) || "";
          node.bubble.innerHTML = renderMarkdown(answer);
          finish();
        });
      }

      /* ---------- 流式解析 SSE ---------- */
      var reader = res.body.getReader();
      var decoder = new TextDecoder("utf-8");
      var buffer = "";
      var chunkIndex = 0;
      var rawAll = [];

      function handleLine(line) {
        if (!line || line.indexOf("data:") !== 0) return;
        var payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") return;

        var obj;
        try { obj = JSON.parse(payload); } catch (e) { return; }
        chunkIndex++;
        rawAll.push(obj);
        logChunk(chunkIndex, obj);

        var delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
        if (delta) {
          if (delta.reasoning_content) reasoningText += delta.reasoning_content;
          if (delta.content) {
            answer += delta.content;
            if (node.typing.parentNode) node.typing.remove();
            node.bubble.innerHTML = renderMarkdown(answer);
            scrollToBottom();
          }
          if (reasoningText && node.reasoning.style.display === "none") {
            node.reasoning.style.display = "";
            node.reasoningBody.textContent = reasoningText;
          } else if (reasoningText) {
            node.reasoningBody.textContent = reasoningText;
          }
        }
        if (obj.usage) usage = obj.usage;
      }

      function read() {
        return reader.read().then(function (r) {
          if (r.done) {
            console.log("%c ← 从大模型接收到的完整数据（流式汇总） ", CSS_RES);
            console.log("分块总数：", chunkIndex);
            console.log("全部分块对象：", rawAll);
            console.log("拼接后的回复内容：", answer);
            if (reasoningText) console.log("拼接后的思考过程：", reasoningText);
            if (usage) console.log("Token 用量：", usage);
            finish();
            return;
          }

          buffer += decoder.decode(r.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop();
          for (var i = 0; i < lines.length; i++) handleLine(lines[i].trim());
          return read();
        });
      }

      return read();
    }).catch(function (err) {
      if (err && err.name === "AbortError") {
        console.warn("%c ⏹ 用户中止了本次生成 ", "color:#f59e0b;font-weight:700");
        node.typing.remove();
        node.bubble.innerHTML = renderMarkdown(answer + "\n\n> （已停止生成）");
        if (answer) history.push({ role: "assistant", content: answer });
        controller = null;
        setBusy(false);
        setStatus("已停止生成");
        return;
      }
      fail(err);
    });
  }

  /* ================= 事件绑定 ================= */
  function autoGrow() {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 180) + "px";
  }

  el.sendBtn.addEventListener("click", sendMessage);

  el.stopBtn.addEventListener("click", function () {
    if (controller) controller.abort();
  });

  el.input.addEventListener("input", autoGrow);

  el.input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  el.quick.addEventListener("click", function (e) {
    if (e.target.tagName !== "BUTTON") return;
    el.input.value = e.target.textContent;
    autoGrow();
    el.input.focus();
  });

  el.messages.addEventListener("click", function (e) {
    var t = e.target;

    if (t.classList.contains("copy-btn")) {
      var code = codeStore[t.getAttribute("data-code")] || "";
      navigator.clipboard.writeText(code).then(function () {
        t.textContent = "已复制";
        setTimeout(function () { t.textContent = "复制"; }, 1400);
      }).catch(function () { t.textContent = "复制失败"; });
      return;
    }

    if (t.classList.contains("copy-msg")) {
      var bubble = t.closest(".bubble-wrap").querySelector(".bubble");
      navigator.clipboard.writeText(bubble.innerText).then(function () {
        t.textContent = "已复制";
        setTimeout(function () { t.textContent = "复制全文"; }, 1400);
      }).catch(function () { t.textContent = "复制失败"; });
    }
  });

  el.saveBtn.addEventListener("click", saveConfig);

  el.model.addEventListener("input", syncBadge);

  el.clearBtn.addEventListener("click", function () {
    if (controller) controller.abort();
    history = [];
    el.messages.innerHTML = "";
    el.usageMeta.textContent = "tokens: 0";
    setStatus("对话已清空");
    greet();
  });

  Array.prototype.forEach.call(document.querySelectorAll(".presets button"), function (btn) {
    btn.addEventListener("click", function () {
      var p = PRESETS[btn.getAttribute("data-preset")];
      if (!p) return;
      el.baseURL.value = p.baseURL;
      el.model.value = p.model;
      if (p.apiKey) el.apiKey.value = p.apiKey;
      syncBadge();
      setStatus("已切换到 " + p.name + "，记得保存配置");
    });
  });

  /* ================= 欢迎语 ================= */
  function greet() {
    var node = createMessage("assistant",
      "你好，我是这个页面接入的大模型助手。\n\n" +
      "- 左侧可修改 **BaseURL / Model ID / API Key**，支持任意 OpenAI 兼容接口\n" +
      "- 每次请求与响应都会打印到浏览器 **Console**，方便查看报文结构\n" +
      "- 支持 **流式输出**、思考过程（reasoning）折叠展示、代码块一键复制\n\n" +
      "试着问我一个问题吧。");
    node.wrap.querySelector(".bubble").innerHTML = renderMarkdown(
      "你好，我是这个页面接入的大模型助手。\n\n" +
      "- 左侧可修改 **BaseURL / Model ID / API Key**，支持任意 OpenAI 兼容接口\n" +
      "- 每次请求与响应都会打印到浏览器 **Console**，方便查看报文结构\n" +
      "- 支持 **流式输出**、思考过程（reasoning）折叠展示、代码块一键复制\n\n" +
      "试着问我一个问题吧。"
    );
  }

  loadConfig();
  greet();
  el.input.focus();
})();
</script>
</body>
</html>
