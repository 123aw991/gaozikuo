<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3 1019gzk</title>
    <style>
        .main{
        display: flex;
        flex-wrap: wrap;
        margin: 10px;
        }
        .box{
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            margin: 10px;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            font-size: 40px;
            transition: all 0.6s; /* 添加过渡效果 */
            box-sizing: border-box; /* 包括边框和内边距在内的总宽度和高度 */   
        }
        .box:first-child:hover{
            background-color: red;
            color: #ccc;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%; /* 圆形 */
            border-width: 10px; /* 边框宽度 */
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px #ccc;
        }
        .box:nth-of-type(4):hover{
            text-shadow: 100px 10px 10px #ccc;
        }
        .box:nth-of-type(5):hover{
            background: linear-gradient(to right,red,green,yellow);
        }
        .box:nth-of-type(5)+:hover{
            background: radial-gradient(circle,red,green,yellow);
        }
        .box:nth-of-type(7):hover{
            background: conic-gradient(red,green,yellow);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
